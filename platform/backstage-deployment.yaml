apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backstage

  template:
    metadata:
      labels:
        app: backstage

    spec:
      enableServiceLinks: false

      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U backstage; do
                echo "waiting for database"
                sleep 2
              done

      containers:
        - name: backstage
          image: mesh-registry:5000/backstage-erp:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 7007

          env:
            - name: NODE_ENV
              value: production

            - name: APP_CONFIG_app_baseUrl
              value: "http://backstage.localhost"

            - name: APP_CONFIG_backend_baseUrl
              value: "http://backstage.localhost"

            - name: APP_CONFIG_backend_cors_origin
              value: "http://backstage.localhost"

            - name: APP_CONFIG_backend_cors_credentials
              value: "true"

            - name: APP_CONFIG_backend_cors_methods
              value: '["GET","HEAD","PATCH","POST","PUT","DELETE"]'

            - name: APP_CONFIG_auth_environment
              value: "development"

            - name: APP_CONFIG_auth_experimentalExtraAllowedOrigins
              value: '["http://backstage.localhost"]'

            - name: AUTH_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-secret
                  key: github-client-id

            - name: AUTH_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secret
                  key: github-client-secret

            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-secret
                  key: GITHUB_TOKEN

            - name: POSTGRES_HOST
              value: postgres

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_USER
              value: backstage

            - name: POSTGRES_PASSWORD
              value: backstage123

            - name: POSTGRES_DB
              value: backstage

            - name: APP_CONFIG_backend_database_client
              value: pg

            - name: APP_CONFIG_backend_database_connection_host
              value: postgres

            - name: APP_CONFIG_backend_database_connection_port
              value: "5432"

            - name: APP_CONFIG_backend_database_connection_user
              value: backstage

            - name: APP_CONFIG_backend_database_connection_password
              value: backstage123

            - name: APP_CONFIG_backend_database_connection_database
              value: backstage

          volumeMounts:
            - name: app-config
              mountPath: /app/app-config.yaml
              subPath: app-config.yaml

            - name: app-config
              mountPath: /app/app-config.production.yaml
              subPath: app-config.production.yaml

      volumes:
        - name: app-config
          configMap:
            name: backstage-config

---

apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: platform

spec:
  selector:
    app: backstage

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 7007