apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command: ['sh', '-c', 'until pg_isready -h postgres -p 5432 -U backstage; do echo waiting for database; sleep 2; done']
      containers:
        - name: backstage
          image: mesh-registry:5000/backstage-erp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7007
          env:
            - name: NODE_ENV
              value: production
            # Força o Knex a usar SQLite apontando para um arquivo no disco do container
            - name: KNEX_CLIENT
              value: sqlite3
            - name: KNEX_CONNECTION
              value: ":memory:"
          volumeMounts:
            - name: app-config
              mountPath: /app/app-config.yaml
              subPath: app-config.yaml
      volumes:
        - name: app-config
          configMap:
            name: backstage-config
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: observabilidade
spec:
  selector:
    app: backstage
  ports:
    - port: 80
      targetPort: 7007