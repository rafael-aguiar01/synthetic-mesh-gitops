apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: contabilidade

resources:
  - ../base

namePrefix: contabilidade-empenhos-

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dummy-service
      spec:
        template:
          spec:
            containers:
            - name: app
              env:
              - name: SERVICE_NAME
                value: "contabilidade-empenhos"
              - name: PORT
                value: "3000"
              - name: ERROR_RATE
                value: "1.0"
              - name: OTEL_SERVICE_NAME
                value: "contabilidade-empenhos"
              - name: LATENCY_MS
                value: "3000"