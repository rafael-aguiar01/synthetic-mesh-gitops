apiVersion: v1
kind: ConfigMap
metadata:
  name: gabinete-code
  namespace: platform
data:
  index.js: |
    const http = require('http');
    const port = 7007;
    const server = http.createServer((req, res) => {
      console.log("Requisicao recebida no modulo: gabinete");
      res.writeHead(200, { 'Content-Type': 'application/json' });
      res.end(JSON.stringify({ status: "UP", module: "gabinete" }));
    });
    server.listen(port, () => {
      console.log("Servico gabinete rodando na porta " + port);
    });