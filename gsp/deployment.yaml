apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsp
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gsp
  template:
    metadata:
      labels:
        app: gsp
    spec:
      containers:
        - name: app
          image: node:18-alpine
          command: ["node", "/app/index.js"]
          ports:
            - containerPort: 7007
          volumeMounts:
            - name: code-volume
              mountPath: /app
      volumes:
        - name: code-volume
          configMap:
            name: gsp-code