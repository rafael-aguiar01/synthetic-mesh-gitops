apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rafael-aguiar01/synthetic-mesh-gitops.git
    targetRevision: HEAD
    path: argocd/apps

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true