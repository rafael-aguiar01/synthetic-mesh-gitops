apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rafael-aguiar01/synthetic-mesh-gitops.git
    targetRevision: HEAD
    path: ${{ values.name }}

  destination:
    server: https://kubernetes.default.svc
    namespace: platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true