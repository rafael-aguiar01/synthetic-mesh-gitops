apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: erp-clone-deployer
  title: Clone de Módulo ERP (Deploy via ArgoCD)
  description: Gera o código e K8s manifests e envia ao GitOps
  tags: [nodejs, argocd]
spec:
  owner: squad-arquitetura
  type: service
  parameters:
    - title: Dados do Serviço
      required: [name]
      properties:
        name:
          title: Nome do Serviço (ex. contabilidade)
          type: string
  steps:
    - id: fetch-base
      name: Gerando K8s Manifests e Código
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ${{ parameters.name }}
        values:
          name: ${{ parameters.name }}
          
    - id: push-gitops
      name: Enviando direto para o GitOps
      action: github:repo:push
      input:
        repoUrl: github.com?repo=synthetic-mesh-gitops&owner=rafael-aguiar01
        defaultBranch: main
        gitCommitMessage: "deploy: adiciona modulo ${{ parameters.name }}"