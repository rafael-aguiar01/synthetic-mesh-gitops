apiVersion: v1
kind: ConfigMap
metadata:
  name: saude-code
  namespace: platform
data:
  index.js: |
    const http = require('http');
    const port = 7007;
    const server = http.createServer((req, res) => {
      console.log("Requisicao recebida no modulo: saude");
      res.writeHead(200, { 'Content-Type': 'application/json' });
      res.end(JSON.stringify({ status: "UP", module: "saude" }));
    });
    server.listen(port, () => {
      console.log("Servico saude rodando na porta " + port);
    });